<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Show</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="bootstrap.min.css" media="screen"/>
  <link rel="stylesheet" href="shows.css" media="screen"/>
  <script src="show.js"></script>
  <script src="addShow.js"></script>

  <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
  <script src="stomp.js"></script>
</head>
<body>
<div class="container">
  <div class="page-header" id="banner">
    <div class="row">
      <div class="col-lg-8 col-md-7 col-sm-6">
        <div class="page-head" id="header-show-title"></div>
        <div style="width: 100%; margin: auto; text-align: center">
          <a id="downloaded-ep-link">Downloaded Episodes</a>
        </div>

        <form class="form-horizontal edit-show-form" id="show-form" onsubmit="submitChange()" method="post" enctype="multipart/form-data">
          <input type="hidden" name="id"/>
          <label>URL</label>
          <input type="text" class="form-control" name="url" oninput="deriveShowName(this)"/>
          <label>Source</label>
          <select name="sourceName" class="form-control">
            <option>SUBSPLEASE</option>
            <option>NYAA</option>
          </select>
          <label>Title</label>
          <input type="text" class="form-control" name="title"/>
          <label>Season</label>
          <input type="text" class="form-control" name="season"/>
          <label>Folder Name</label>
          <input type="text" class="form-control" name="folderName"/>
          <label>Release Schedule</label>
          <input type="text" class="form-control" name="releaseScheduleCron"/>
          <label>Naming Pattern</label>
          <input type="text" class="form-control" name="episodeNamePattern" value="S<SEASON_2>E<EPISODE_2>"/>
          <label>Skip Episodes</label>
          <input type="text" class="form-control" name="skipEpisodeString"/>
          <label>Active</label>
          <input type="checkbox" class="form-control" name="isActive"/>
          <div class="page-head">
            <button type="submit" name="button" style="margin-top: .4em;">保存</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

</body>
</html>
